server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/orders}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/order-service/master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      properties:
        # Tópicos são criados pelo KafkaAdmin com as partições corretas, nunca implicitamente pelo consumidor
        allow.auto.create.topics: false
        # Descobre novas partições em até 30s (padrão: 5 min)
        metadata.max.age.ms: 30000

chassis:
  security:
    # Endereço interno de onde o serviço baixa as chaves públicas do Keycloak
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/pedidos/protocol/openid-connect/certs}
    # Emissor esperado no token (endereço público pelo qual o cliente obteve o token)
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/pedidos}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  kafka:
    partitions: 3
    topics:
      order-events: order-events
      payment-events: payment-events

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}

logging:
  # Em texto (desenvolvimento local) o correlation id aparece em cada linha. Nos containers o formato é JSON
  # (LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs no Dockerfile) e o MDC entra como campo do documento.
  pattern:
    correlation: "[%X{correlationId:-}] "
