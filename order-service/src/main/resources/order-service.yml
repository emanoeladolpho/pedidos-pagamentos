server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/orders}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/order-service/master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-service
      auto-offset-reset: earliest

chassis:
  security:
    # Endereço interno de onde o serviço baixa as chaves públicas do Keycloak
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/pedidos/protocol/openid-connect/certs}
    # Emissor esperado no token (endereço público pelo qual o cliente obteve o token)
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/pedidos}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  kafka:
    partitions: 3
    topics:
      order-events: order-events
      payment-events: payment-events
