server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/payments}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/payment-service/master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest

app:
  kafka:
    partitions: 3
    topics:
      order-events: order-events
      payment-events: payment-events
  gateway:
    simulated:
      latency: ${GATEWAY_LATENCY:50ms}
      failure-rate: ${GATEWAY_FAILURE_RATE:0}
      decline-rate: ${GATEWAY_DECLINE_RATE:0}
