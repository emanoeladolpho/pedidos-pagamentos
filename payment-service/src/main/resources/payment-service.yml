server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/payments}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/payment-service/master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest

chassis:
  security:
    # Endereço interno de onde o serviço baixa as chaves públicas do Keycloak
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/pedidos/protocol/openid-connect/certs}
    # Emissor esperado no token (endereço público pelo qual o cliente obteve o token)
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/pedidos}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  kafka:
    partitions: 3
    topics:
      order-events: order-events
      payment-events: payment-events
  gateway:
    simulated:
      latency: ${GATEWAY_LATENCY:50ms}
      failure-rate: ${GATEWAY_FAILURE_RATE:0}
      decline-rate: ${GATEWAY_DECLINE_RATE:0}

# Políticas do gateway de pagamento: retry( circuitBreaker( timeLimiter( chamada ) ) )
resilience4j:
  timelimiter:
    instances:
      payment-gateway:
        timeout-duration: ${GATEWAY_TIMEOUT:2s}
        cancel-running-future: true
  retry:
    instances:
      payment-gateway:
        max-attempts: ${GATEWAY_RETRY_MAX_ATTEMPTS:3}
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - io.github.emanoeladolpho.payment.infrastructure.adapter.out.gateway.GatewayTechnicalException
          - java.util.concurrent.TimeoutException
  circuitbreaker:
    instances:
      payment-gateway:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: ${GATEWAY_TIMEOUT:2s}
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - io.github.emanoeladolpho.payment.infrastructure.adapter.out.gateway.GatewayTechnicalException
          - java.util.concurrent.TimeoutException
