databaseChangeLog:
  - changeSet:
      id: 001-create-payments
      author: emanoeladolpho
      changes:
        - createTable:
            tableName: payments
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true } }
              # Um pagamento por pedido: garante no banco a idempotência pelo identificador do pedido
              - column: { name: order_id, type: UUID, constraints: { nullable: false, unique: true, uniqueConstraintName: uk_payments_order } }
              - column: { name: customer_id, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: amount, type: "NUMERIC(12,2)", constraints: { nullable: false } }
              - column: { name: currency, type: VARCHAR(3), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: gateway_transaction_id, type: VARCHAR(100) }
              - column: { name: failure_reason, type: VARCHAR(500) }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, constraints: { nullable: false } }
        - sql:
            sql: >
              ALTER TABLE payments
                ADD CONSTRAINT ck_payments_status
                  CHECK (status IN ('PENDING', 'APPROVED', 'DECLINED', 'REFUNDED', 'CANCELLED')),
                ADD CONSTRAINT ck_payments_amount CHECK (amount > 0)
